<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="jev-opus demo: effort changes from medium to high and back to medium inside one Claude Code prompt while the prompt cache keeps growing">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #6e7681; }
    .tool { fill: #58a6ff; }
    .jev { fill: #d2a8ff; }
    .low { fill: #3fb950; font-weight: bold; }
    .med { fill: #39c5cf; font-weight: bold; }
    .high { fill: #e3b341; font-weight: bold; }
    .ok { fill: #3fb950; }
    .fail { fill: #f85149; }
    .line { opacity: 0; animation: show 16s infinite; }
    .status { opacity: 0; animation: blink 16s infinite; }
    @keyframes show { 0% { opacity: 0; } 2% { opacity: 1; } 94% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 0; } 1% { opacity: 1; } 100% { opacity: 1; } }
  </style>
  <rect class="bg" width="860" height="430" rx="10"/>
  <rect class="bar" width="860" height="30" rx="10"/>
  <circle cx="20" cy="15" r="6" fill="#f85149"/><circle cx="40" cy="15" r="6" fill="#e3b341"/><circle cx="60" cy="15" r="6" fill="#3fb950"/>
  <text x="330" y="20" class="dim">jev-opus claude · Opus 5.5 · Jev</text>

  <text x="20" y="60" class="line" style="animation-delay:0s">› fix the failing date tests</text>
  <text x="20" y="92" class="line" style="animation-delay:1s"><tspan class="jev">◆ jev</tspan> task debugging · difficulty 1.3/4          → <tspan class="med">MEDIUM</tspan></text>
  <text x="20" y="120" class="line" style="animation-delay:2s"><tspan class="tool">  ▸ Read</tspan> <tspan class="dim">dates.js</tspan></text>
  <text x="20" y="148" class="line" style="animation-delay:3s"><tspan class="jev">◆ jev</tspan> next: exploring                        → <tspan class="dim">stays medium</tspan></text>
  <text x="20" y="176" class="line" style="animation-delay:4.5s"><tspan class="tool">  ▸ Bash</tspan> <tspan class="dim">npm test</tspan>   <tspan class="fail">✗ 3 failing</tspan></text>
  <text x="20" y="204" class="line" style="animation-delay:5.5s"><tspan class="jev">◆ jev</tspan> failing checks                         → <tspan class="med">MEDIUM</tspan> ⇒ <tspan class="high">HIGH</tspan></text>
  <text x="20" y="232" class="line" style="animation-delay:7s"><tspan class="tool">  ▸ Edit</tspan> <tspan class="dim">dates.js  (400-year rule, 1-based months)</tspan></text>
  <text x="20" y="260" class="line" style="animation-delay:8s"><tspan class="tool">  ▸ Bash</tspan> <tspan class="dim">npm test</tspan>   <tspan class="ok">✓ 3 pass</tspan></text>
  <text x="20" y="288" class="line" style="animation-delay:9s"><tspan class="jev">◆ jev</tspan> matching checks passed                 → <tspan class="high">HIGH</tspan> ⇒ <tspan class="med">MEDIUM</tspan></text>
  <text x="20" y="326" class="line" style="animation-delay:10.5s"><tspan class="ok">✓</tspan> fixed both bugs · all 3 tests pass</text>
  <text x="20" y="354" class="line dim" style="animation-delay:11.5s">  cache reads per call: 24.5k → 29.9k → 30.0k → 31.4k → 32.3k   (never reset)</text>

  <rect x="0" y="392" width="860" height="38" class="bar"/>
  <text x="20" y="416" class="dim">status line:</text>
  <text x="130" y="416" class="line" style="animation-delay:9s"><tspan class="jev">◆ Jev ·</tspan> medium → high → <tspan class="med">MEDIUM</tspan> · verifying</text>
</svg>
